services:
  twitch-bot:
    build: .
    container_name: twitch-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs

    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
